name: CrossBorder v3.1 Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Initialize unified demo dataset
        run: python -c "from crossborder_api.app_state import runtime; print(runtime.ensure_unified_dataset())"

      - name: Python regression
        run: python -m pytest -q

      - name: 100k performance gate
        run: python scripts/benchmark_sqlite.py --rows 100000 --database .cache\benchmark\ci-100k.db --max-seconds 15 --max-database-mb 200

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t crossborder-ai:ci .

      - name: Health check
        run: |
          docker run -d --rm --name crossborder-ai-ci -p 8000:8000 crossborder-ai:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs crossborder-ai-ci
          exit 1
